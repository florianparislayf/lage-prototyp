<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Karte · Lage Prototyp</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300..800&display=swap">
<style>
/* Layout: full-screen map; floating search + chips on top; bottom sheet with a scrollable listing feed (a left panel on desktop). */
:root {
  --font: 'Sora', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --ink: #0B2234; --muted: #4E6475; --surface: #FFFFFF; --surface-2: #F2F8FC; --line: #DCEAF3; --line-strong: #C9DDEA;
  --accent: #0369A1; --on-accent: #FFFFFF; --accent-soft: #E0F2FE; --on-accent-soft: #035784;
  --good: #047857; --good-soft: #DCF5EA; --warn: #A34A06; --warn-soft: #FDF0DC; --heart: #D61F55;
  --shadow: 0 6px 20px rgba(11,34,52,.12); --shadow-lg: 0 14px 34px rgba(11,34,52,.2); --scrim: rgba(11,34,52,.36);
  --map-land: #F3F7FA; --map-out: #E4EAF0; --map-forest: #D8EFE2; --map-street: #FFFFFF; --map-casing: #DCEAF3; --map-mw: #CFE0EA;
  --map-water: #B5E1F8; --map-shore: #7CC6EC; --map-rail: #A3B7C6; --map-label: #4E6475; --map-halo: #F3F7FA;
  --pin-bubble: #FFFFFF; --pin-fill: #FFFFFF; --stage: #E3EBF1; --bezel: #0B1620;
  --pano-sky: #DCEBF6; --pano-ground: #E3EBDD; --pano-alps: #A6B8CB; --pano-snow: #FFFFFF; --pano-hill: #86A688; --pano-lake: #6FA8D0;
  --pano-city: #AEB7C1; --pano-mark: #5F6C79; --pano-tree: #6E9B66; --pano-halo: #FFFFFF;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ink: #E5EEF5; --muted: #9AB0C2; --surface: #122230; --surface-2: #0F1D29; --line: #22384A; --line-strong: #2E4A60;
  --accent: #38BDF8; --on-accent: #032436; --accent-soft: #0B3A55; --on-accent-soft: #BAE6FD;
  --good: #34D399; --good-soft: #0E3B2E; --warn: #FBBF24; --warn-soft: #3A2C0B; --heart: #FF5C8A;
  --shadow: 0 6px 20px rgba(0,0,0,.45); --shadow-lg: 0 14px 34px rgba(0,0,0,.55); --scrim: rgba(0,0,0,.55);
  --map-land: #0E1B26; --map-out: #08121A; --map-forest: #11281E; --map-street: #1C2E3D; --map-casing: #1A2B39; --map-mw: #263C4E;
  --map-water: #133048; --map-shore: #1F4E6E; --map-rail: #3C566B; --map-label: #8FA8BB; --map-halo: #0E1B26;
  --pin-bubble: #122230; --pin-fill: #122230; --stage: #070D12; --bezel: #2A3946; color-scheme: dark;
  --pano-sky: #16283A; --pano-ground: #1A2A24; --pano-alps: #4B5E74; --pano-snow: #C3D0E0; --pano-hill: #2F4D3B; --pano-lake: #285A80;
  --pano-city: #394656; --pano-mark: #8EA0B4; --pano-tree: #2B4A34; --pano-halo: #122230;
} }
:root[data-theme="dark"] {
  --ink: #E5EEF5; --muted: #9AB0C2; --surface: #122230; --surface-2: #0F1D29; --line: #22384A; --line-strong: #2E4A60;
  --accent: #38BDF8; --on-accent: #032436; --accent-soft: #0B3A55; --on-accent-soft: #BAE6FD;
  --good: #34D399; --good-soft: #0E3B2E; --warn: #FBBF24; --warn-soft: #3A2C0B; --heart: #FF5C8A;
  --shadow: 0 6px 20px rgba(0,0,0,.45); --shadow-lg: 0 14px 34px rgba(0,0,0,.55); --scrim: rgba(0,0,0,.55);
  --map-land: #0E1B26; --map-out: #08121A; --map-forest: #11281E; --map-street: #1C2E3D; --map-casing: #1A2B39; --map-mw: #263C4E;
  --map-water: #133048; --map-shore: #1F4E6E; --map-rail: #3C566B; --map-label: #8FA8BB; --map-halo: #0E1B26;
  --pin-bubble: #122230; --pin-fill: #122230; --stage: #070D12; --bezel: #2A3946; color-scheme: dark;
  --pano-sky: #16283A; --pano-ground: #1A2A24; --pano-alps: #4B5E74; --pano-snow: #C3D0E0; --pano-hill: #2F4D3B; --pano-lake: #285A80;
  --pano-city: #394656; --pano-mark: #8EA0B4; --pano-tree: #2B4A34; --pano-halo: #122230;
}
html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: border-box; }
body { height: 100%; margin: 0; overflow: hidden; background: var(--map-land); color: var(--ink); font-family: var(--font); font-size: 14px; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: inherit; -webkit-tap-highlight-color: transparent; }
input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.trunc { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.muted { color: var(--muted); }
svg { flex: none; }

/* The stage holds the app. On wide screens a Desktop / Mobil switch shows the app full-size or inside a phone frame.
   Layout switches on the app's own width (container query), so the frame gets the real mobile layout. */
.stage { position: relative; height: 100%; background: var(--stage); }
.stage.is-mobile { display: flex; align-items: center; justify-content: center; padding: 24px; }
.app { position: relative; height: 100%; overflow: hidden; overflow: clip; container: app / size; --sheet-h: 320px; --panel: 440px; }
.stage.is-mobile .app { flex: none; width: 390px; height: min(844px, 100%); border-radius: 44px; box-shadow: 0 0 0 10px var(--bezel), 0 30px 80px rgba(11,34,52,.3); }
.view-toggle { display: none; }
@media (min-width: 900px) {
  .view-toggle { position: absolute; top: 12px; right: 16px; z-index: 100; display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
  .view-toggle button { display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 999px; font-size: 13px; font-weight: 700; color: var(--ink); }
  .view-toggle button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
}

/* ---------- map ---------- */
.map { position: absolute; inset: 0; overflow: hidden; overflow: clip; touch-action: none; cursor: grab; background: var(--map-land); user-select: none; -webkit-user-select: none; }
.map.is-dragging { cursor: grabbing; }
.map.is-picking { cursor: crosshair; }
.map-svg { position: absolute; left: -40%; top: -40%; width: 180%; height: 180%; display: block; transform-origin: 22.2222% 22.2222%; }
.map-svg path { vector-effect: non-scaling-stroke; }
.m-land { fill: var(--map-land); }
.m-edge path { fill: var(--map-land); }
/* Switzerland: the country, its lakes, rivers, motorways and railways; neighbours muted; coarse when zoomed out */
.m-out { fill: var(--map-out); }
.m-ch { fill: var(--map-land); }
.m-sw-lake { fill: var(--map-water); }
.m-sw-river { fill: none; stroke: var(--map-water); stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
.m-sw-road { fill: none; stroke: var(--map-casing); stroke-width: 1; }
.m-sw-mw { fill: none; stroke: var(--map-mw); stroke-width: 2.2; stroke-linejoin: round; }
.m-sw-rail { fill: none; stroke: var(--map-rail); stroke-width: .9; stroke-dasharray: 3 3; opacity: .8; }
.m-border { fill: none; stroke: var(--map-label); stroke-width: 1.3; stroke-dasharray: 5 3; opacity: .5; }
.map-svg .m-co { display: none; }
.map-svg.z-cty .m-co { display: inline; }
.map-svg.z-cty .m-fi, .map-svg.z-cty .m-zh, .map-svg.z-cty .m-sw-road { display: none; }
.map-svg.z-reg .m-streets { display: none; }
/* zoomed out: bubbles with the number of listings */
.pc { z-index: 3; display: grid; place-items: center; min-width: 34px; height: 34px; padding: 0 9px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-size: 12.5px; font-weight: 800; font-variant-numeric: tabular-nums; box-shadow: 0 0 0 3px var(--surface), var(--shadow); }
.pc.pc-m { min-width: 40px; height: 40px; font-size: 13.5px; }
.pc.pc-l { min-width: 48px; height: 48px; font-size: 14.5px; }
.pc.pc-near { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 2px var(--warn) inset, var(--shadow); }
.pc:hover { filter: brightness(1.08); }
.lbl-c { font-size: 11.5px; font-weight: 700; letter-spacing: .02em; text-transform: none; color: var(--ink); }
.lbl-c.lbl-big { font-size: 13px; font-weight: 800; }
.fade-in { stop-color: var(--map-land); stop-opacity: 1; }
.fade-out { stop-color: var(--map-land); stop-opacity: 0; }
.m-forest { fill: var(--map-forest); }
.m-streets { fill: none; stroke: var(--map-street); stroke-width: 1.3; stroke-linecap: round; transition: opacity .3s; }
.z-far .m-streets { opacity: 0; }
.m-casing { fill: none; stroke: var(--map-casing); stroke-width: 6.5; stroke-linecap: round; stroke-linejoin: round; }
.m-road { fill: none; stroke: var(--map-street); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.m-mw-casing { fill: none; stroke: var(--map-mw); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
.m-mw { fill: none; stroke: var(--map-street); stroke-width: 5.5; stroke-linecap: round; stroke-linejoin: round; }
.m-river-edge { fill: none; stroke: var(--map-shore); stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
.m-river { fill: none; stroke: var(--map-water); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
.m-sihl.m-river-edge { stroke-width: 6; } .m-sihl.m-river { stroke-width: 4; }
.m-lake { fill: var(--map-water); stroke: var(--map-shore); stroke-width: 1.4; stroke-linejoin: round; }
.m-rail { fill: none; stroke: var(--map-rail); stroke-width: 1.8; stroke-dasharray: 7 5; stroke-linejoin: round; }
.m-cone { fill: var(--accent); fill-opacity: .14; stroke: var(--accent); stroke-width: 1.4; stroke-linejoin: round; }
.m-route { fill: none; stroke: var(--accent); stroke-width: 2.6; stroke-dasharray: 1 7; stroke-linecap: round; }
.overlay { position: absolute; inset: 0; overflow: hidden; overflow: clip; pointer-events: none; }
.ov-layer, .ov-sub { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }
.ov-sub > * { position: absolute; left: 0; top: 0; pointer-events: auto; }
.map.is-moving .ov-sub > * { pointer-events: none !important; }
.lbl { pointer-events: none !important; font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--map-label); white-space: nowrap; text-shadow: 0 0 3px var(--map-halo), 0 0 2px var(--map-halo), 0 0 1px var(--map-halo); }
.lbl-w { font-size: 11px; font-style: italic; letter-spacing: .32em; color: var(--accent); opacity: .8; }
.lbl-h { letter-spacing: .22em; }
.hb, .work-mk, .place-mk { pointer-events: none !important; display: flex; align-items: center; gap: 4px; white-space: nowrap; font-weight: 700; }
.hb { height: 24px; padding: 0 8px 0 5px; border-radius: 999px; background: var(--surface); border: 1.5px solid var(--ink); color: var(--ink); font-size: 10px; letter-spacing: .04em; box-shadow: 0 2px 6px rgba(11,34,52,.16); }
.hb.is-on { z-index: 5; height: 28px; padding: 0 10px 0 7px; font-size: 11px; background: var(--accent); border: 2px solid var(--surface); color: var(--on-accent); box-shadow: var(--shadow); }
.place-mk { z-index: 5; height: 28px; padding: 0 10px 0 7px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-size: 11px; box-shadow: var(--shadow); border: 2px solid var(--surface); }
.work-mk { z-index: 6; height: 30px; padding: 0 11px 0 8px; border-radius: 999px; background: var(--ink); color: var(--surface); font-size: 11.5px; box-shadow: var(--shadow); border: 2px solid var(--surface); }
.pin { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 44px; }
.pin-bubble { display: flex; align-items: center; gap: 3px; height: 22px; padding: 0 8px; border-radius: 999px; background: var(--pin-bubble); color: var(--ink); font-size: 12px; line-height: 22px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; box-shadow: 0 2px 8px rgba(11,34,52,.18); }
.pin-bubble svg { color: var(--accent); }
.pin-drop { position: relative; display: block; width: 30px; height: 37px; transform-origin: 50% 100%; filter: drop-shadow(0 3px 3px rgba(11,34,52,.22)); transition: transform .2s; }
.pin-drop::before { content: ""; position: absolute; left: 0; top: 0; width: 30px; height: 30px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--pin-fill); border: 3px solid var(--accent); box-sizing: border-box; }
.pin-dot { position: absolute; left: 10px; top: 10px; width: 10px; height: 10px; border-radius: 999px; background: var(--accent); }
.pin.is-saved .pin-dot { background: var(--heart); }
.pin.is-sel { z-index: 5; }
.pin.is-sel .pin-drop { transform: scale(1.18); }
.pin.is-sel .pin-drop::before { background: var(--accent); }
.pin.is-sel .pin-dot { background: var(--on-accent); }
.pin.is-sel .pin-bubble { background: var(--accent); color: var(--on-accent); }
.pin.is-sel .pin-bubble svg { color: var(--on-accent); }
.pp { display: flex; align-items: center; gap: 3px; height: 28px; padding: 0 10px; border-radius: 999px; background: var(--pin-bubble); color: var(--ink); font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; box-shadow: 0 2px 8px rgba(11,34,52,.22); }
.pp::after { content: ""; position: absolute; left: 50%; bottom: -4px; width: 9px; height: 9px; margin-left: -4.5px; background: var(--pin-bubble); transform: rotate(45deg); border-radius: 0 0 2px 0; }
.pp svg { color: var(--accent); }
.pp:hover { z-index: 4; background: var(--accent-soft); }
.pp:hover::after { background: var(--accent-soft); }
.pd { width: 12px; height: 12px; border-radius: 999px; background: var(--pin-fill); border: 3px solid var(--accent); box-shadow: 0 1px 4px rgba(11,34,52,.3); }
.pd::before { content: ""; position: absolute; inset: -14px; border-radius: 999px; }
.pd.is-saved { border-color: var(--heart); }
.pd.pd-hi { background: var(--accent); }
.pp.pp-hi, .pp.pp-hi::after { background: var(--accent); color: var(--on-accent); }
.pp.pp-hi svg { color: var(--on-accent); }
.pp.pp-lo { opacity: .72; }
/* near matches on the map: dashed, a step back from the exact results */
.pp.pp-near, .pp.pp-near::after { background: var(--surface); }
.pp.pp-near { color: var(--muted); outline: 1.5px dashed var(--warn); outline-offset: -1.5px; box-shadow: 0 2px 6px rgba(11,34,52,.16); }
.pd.pd-near { background: var(--surface); border: 2px dashed var(--warn); }
/* the pin layer is keyed DOM, so stacking comes from classes, not from the order of the nodes */
.lbl { z-index: 0; } .hb, .pd { z-index: 1; } .pp.pp-near { z-index: 2; } .pp { z-index: 3; } .pp.pp-near:hover { z-index: 4; }
/* the list shows only what the map shows: a note with a way back to all results */
.inview { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 14px; padding: 6px 6px 6px 14px; border-radius: 14px; background: var(--surface-2); font-size: 12.5px; line-height: 1.35; color: var(--muted); }
.inview button { flex: none; height: 32px; padding: 0 12px; border-radius: 999px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); font-size: 12.5px; font-weight: 700; }
.cluster { width: 38px; height: 38px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-weight: 800; font-size: 14px; border: 3px solid var(--pin-bubble); box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center; }

/* ---------- top bar ---------- */
.top { position: absolute; left: 0; right: 0; top: 0; z-index: 40; display: flex; flex-direction: column; gap: 6px; padding-top: calc(12px + env(safe-area-inset-top, 0px)); pointer-events: none; }
.top > * { pointer-events: auto; }
.search { margin-left: max(16px, env(safe-area-inset-left, 0px)); margin-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 8px; height: 54px; padding: 0 5px 0 10px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow); }
.brand { flex: none; text-decoration: none; color: inherit; display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 800; letter-spacing: -.01em; }
.vr { flex: none; width: 1px; height: 24px; background: var(--line); }
.search > svg { color: var(--accent); }
.search input { flex: 1; min-width: 0; height: 44px; border: 0; background: transparent; font-size: 15px; font-weight: 600; outline-offset: -2px; }
.search input::placeholder { color: var(--muted); font-weight: 500; }
.seg-deal { flex: none; display: flex; height: 44px; border-radius: 999px; background: var(--surface-2); }
.seg-deal button { height: 44px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 600; }
.seg-deal button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.chips { display: flex; align-items: center; gap: 8px; overflow-x: auto; padding: 2px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px)); scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 15px; border-radius: 999px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); font-size: 14px; font-weight: 600; white-space: nowrap; box-shadow: var(--shadow); }
.chip-filter { padding: 0 9px 0 15px; border-color: transparent; }
.chip-count { min-width: 24px; height: 24px; padding: 0 7px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-size: 12px; line-height: 24px; font-weight: 700; text-align: center; }
.chip-on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); padding: 0 11px 0 15px; }
.chip-add { padding: 0 14px 0 11px; }
.chip-add > svg { color: var(--accent); }
.chip-n { font-size: 12px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip-dream { background: var(--accent-soft); border-color: transparent; color: var(--on-accent-soft); padding: 0 14px 0 12px; }
.chip-work { background: var(--ink); border-color: var(--ink); color: var(--surface); padding: 0 14px 0 12px; }
.chip-work .chip-sub { font-size: 12px; font-weight: 500; opacity: .85; }
.pick-banner { position: absolute; z-index: 45; top: calc(74px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 16px; border-radius: 20px; background: var(--ink); color: var(--surface); box-shadow: var(--shadow-lg); font-size: 14px; font-weight: 600; }
.pick-banner span { flex: 1; }
.pick-banner button { height: 44px; padding: 0 16px; border-radius: 999px; background: var(--surface); color: var(--ink); font-weight: 700; }

/* ---------- map controls ---------- */
.map-ctl { position: absolute; z-index: 25; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(var(--sheet-h) + 14px); display: flex; flex-direction: column; align-items: flex-end; gap: 8px; transition: bottom .35s cubic-bezier(.2,.8,.2,1), opacity .2s; }
.map-ctl-l { position: absolute; z-index: 25; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(var(--sheet-h) + 14px); transition: bottom .35s cubic-bezier(.2,.8,.2,1), opacity .2s; }
.app[data-sheet="full"] .map-ctl, .app[data-sheet="full"] .map-ctl-l { opacity: 0; pointer-events: none; }
.ctl-group { display: flex; flex-direction: column; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); overflow: hidden; }
.ctl { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--ink); }
.ctl-solo { border-radius: 999px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
.ctl-seg { display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
.ctl-seg button { display: flex; align-items: center; gap: 4px; height: 38px; padding: 0 11px; border-radius: 999px; font-size: 12.5px; font-weight: 700; }
.ctl-seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

/* ---------- sheet ---------- */
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 30; height: var(--sheet-h); display: flex; flex-direction: column; background: var(--surface); border-radius: 26px 26px 0 0; box-shadow: 0 -10px 30px rgba(11,34,52,.14); transition: height .35s cubic-bezier(.2,.8,.2,1); }
.sheet.no-anim { transition: none; }
.sheet-grip { flex: none; position: relative; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 16px max(12px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px)); touch-action: none; cursor: grab; }

.prompt { display: flex; flex-direction: column; gap: 10px; padding: 18px 18px 16px; border-radius: 24px; background: var(--surface-2); border: 1px solid var(--line); }

.pano-card { padding: 12px 12px 8px; border-radius: 24px; border: 1px solid var(--line); background: var(--surface); }

.card-body { display: flex; flex-direction: column; gap: 1px; min-width: 0; padding: 0 2px; }

.dr-f { font-size: 12px; line-height: 1.35; color: var(--muted); }
.dr-l { font-size: 12px; line-height: 1.35; font-weight: 600; }
.dr-l.is-lack { color: var(--warn); }
.dr-l.is-wish { color: var(--muted); }
.dr-l.is-ok { color: var(--good); }
.dr-rp { display: flex; flex-direction: column; align-items: flex-end; text-align: right; }
.dr-rp b { font-size: 13.5px; font-weight: 800; white-space: nowrap; }
.dr-rp small { font-size: 11px; color: var(--muted); white-space: nowrap; }
.dr-fit { margin-top: 3px; padding: 0 8px; border-radius: 999px; background: var(--good-soft); color: var(--good); font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; }
.dr-row.is-near .dr-fit { background: var(--surface-2); color: var(--muted); }
.dr-ckb { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 44px; padding: 6px 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; font-weight: 600; text-align: left; }
.dr-ckb:hover { background: var(--surface-2); }
.dr-ckb .dr-l { flex: 1; min-width: 0; }
.dr-ckb svg { flex: none; }
.dr-of { flex: none; font-variant-numeric: tabular-nums; }
.dr-ck { display: flex; flex-direction: column; gap: 3px; margin: 0; padding: 2px 12px 10px; list-style: none; font-size: 12.5px; line-height: 1.35; }
.dr-ck li { display: flex; align-items: flex-start; gap: 6px; }
.dr-ck svg { flex: none; margin-top: 2px; }
.dr-ck small { font-size: 12px; color: var(--muted); }
.dr-ck .is-ok svg { color: var(--good); }
.dr-ck .is-no { color: var(--warn); font-weight: 600; }
.dr-ck .is-soft { color: var(--muted); }
.dr-more { width: 100%; margin-top: 10px; }
.f-sec { display: flex; flex-direction: column; gap: 8px; }
.f-sec h3 { margin: 0; font-size: 11px; line-height: 16px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.f-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.f-row output, .f-row .v { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 600; }
.seg button svg { color: var(--accent); }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.seg button[aria-pressed="true"] svg { color: var(--on-accent); }
input[type="range"] { width: 100%; height: 32px; margin: 0; accent-color: var(--accent); }
.f-scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: -4px; }
.f-note { margin: 0; font-size: 12px; line-height: 1.45; color: var(--muted); }
.tg { width: 100%; min-height: 60px; display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.tg:last-child { border-bottom: 0; }
.tg-t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.tg-l { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; }
.tg-h { font-size: 12px; line-height: 1.4; color: var(--muted); }
.tg-n { flex: none; min-width: 26px; text-align: right; font-size: 12px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.sw { flex: none; position: relative; width: 46px; height: 28px; border-radius: 999px; background: var(--line-strong); transition: background .2s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.tg[aria-pressed="true"] .sw { background: var(--accent); }
.tg[aria-pressed="true"] .sw::after { transform: translateX(18px); }
.fld { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); }
.fld svg { color: var(--accent); }
.fld input { flex: 1; min-width: 0; height: 48px; border: 0; background: transparent; font-size: 15px; outline-offset: -2px; }
.w-list { display: flex; flex-direction: column; }
.w-row { width: 100%; min-height: 60px; display: flex; align-items: center; gap: 12px; padding: 8px 4px; border-bottom: 1px solid var(--line); }
.w-row > svg:first-child { color: var(--accent); }
.w-row span { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.w-row b { font-size: 15px; }
.w-row small { font-size: 12.5px; color: var(--muted); }
.w-row[aria-pressed="true"] { color: var(--accent); }
.w-row[aria-pressed="true"] small { color: var(--muted); }
.s-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.s-row img { width: 72px; height: 72px; border-radius: 16px; object-fit: cover; }
.s-open { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; min-height: 44px; }
.s-open b { font-size: 14px; }
.s-open span { font-size: 12.5px; color: var(--muted); }
.cmp-wrap { overflow-x: auto; }
.cmp { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.cmp th, .cmp td { padding: 9px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.cmp thead th { font-size: 12px; font-weight: 700; }
.cmp thead img { display: block; width: 100%; max-width: 120px; aspect-ratio: 4 / 3; height: auto; border-radius: 12px; object-fit: cover; margin-bottom: 6px; }
.cmp tbody th { font-weight: 600; color: var(--muted); white-space: nowrap; }
.cmp td.best { color: var(--good); font-weight: 800; }
.form { display: flex; flex-direction: column; gap: 14px; }
.form label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; }
.form input, .form textarea { border: 1px solid var(--line); border-radius: 14px; background: var(--surface-2); padding: 12px 14px; font-size: 15px; font-weight: 400; }
.form textarea { min-height: 110px; resize: vertical; line-height: 1.5; }
.ok { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 18px; border-radius: 20px; background: var(--good-soft); color: var(--good); }
.ok p { margin: 0; color: var(--ink); line-height: 1.5; }
.f-work { width: 100%; min-height: 64px; display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface-2); }
.f-work-ic { flex: none; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: var(--ink); color: var(--surface); }
.f-work-t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.f-work-t b { font-size: 15px; }
.f-work-t small { font-size: 12.5px; line-height: 1.35; color: var(--muted); }
.f-work-a { flex: none; display: flex; align-items: center; gap: 2px; font-size: 14px; font-weight: 700; color: var(--accent); }
.f-note b { color: var(--ink); }
/* min / max pairs as on the portals */
.rng { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.sel { position: relative; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.sel-k { font-size: 12px; font-weight: 600; color: var(--muted); }
.sel select { width: 100%; height: 48px; padding: 0 36px 0 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); font: inherit; font-size: 16px; font-weight: 600; cursor: pointer; appearance: none; -webkit-appearance: none; }
.sel svg { position: absolute; right: 12px; bottom: 16px; color: var(--muted); pointer-events: none; }
/* Tragbarkeit inputs (buying) */
.money-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.money { min-width: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
.money-in { display: flex; align-items: center; gap: 6px; height: 48px; padding: 0 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); }
.money-in > span { font-size: 13px; font-weight: 600; color: var(--muted); }
.money-in input { flex: 1; min-width: 0; height: 100%; padding: 0; border: 0; background: none; color: var(--ink); font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; outline: none; }
.money-in input::placeholder { color: var(--muted); font-weight: 500; }
.money-in:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
/* Travel time to a place */
.pl { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px 8px 14px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface-2); }
.pl-h { display: flex; align-items: center; gap: 10px; }
.pl-ic { flex: none; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: var(--accent); color: var(--on-accent); }
.pl-t { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.pl-t b { font-size: 15px; }
.pl-t small { font-size: 12.5px; color: var(--muted); }
.pl .x-btn { background: var(--surface); }
.pl .seg { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
.pl .seg button { justify-content: center; height: 40px; padding: 0 2px; gap: 3px; font-size: 12.5px; white-space: nowrap; }
.toast { position: absolute; left: 50%; top: calc(118px + env(safe-area-inset-top, 0px)); z-index: 95; transform: translateX(-50%); max-width: calc(100% - 32px); padding: 11px 16px; border-radius: 999px; background: var(--ink); color: var(--surface); font-size: 13px; font-weight: 600; box-shadow: var(--shadow-lg); }

/* ---------- desktop: list panel on the left, map on the right ---------- */
@container app (min-width: 900px) {
  .sheet { top: 0; height: auto !important; width: var(--panel); border-radius: 0; box-shadow: 1px 0 0 var(--line), 10px 0 30px rgba(11,34,52,.08); transition: none; }
  .sheet-grip { cursor: default; padding-top: 18px; }
  .sheet-grip::before { display: none; }
  .top { left: var(--panel); }
  .search { max-width: 640px; margin-right: 236px; }
  .map-ctl { bottom: 24px !important; opacity: 1 !important; pointer-events: auto !important; }
  .map-ctl-l { left: calc(var(--panel) + 16px); bottom: 24px !important; opacity: 1 !important; pointer-events: auto !important; }
  .map-btn { display: none !important; }
  .detail { right: auto; width: var(--panel); box-shadow: 10px 0 30px rgba(11,34,52,.12); transform: translateX(-100%); }
  .detail.is-open { transform: none; }
  .pick-banner { left: calc(var(--panel) + 16px); max-width: 640px; }
  .draw-banner span { flex: 1 1 auto; }
  .draw-banner button { flex: none; }
  .toast { left: calc(var(--panel) + (100% - var(--panel)) / 2); }
  .dlg-panel { left: 50%; right: auto; bottom: auto; top: 50%; width: min(560px, calc(100% - 48px)); max-height: min(780px, calc(100% - 48px)); border-radius: 26px; opacity: 0; transform: translate(-50%, -46%); transition: transform .25s, opacity .25s; }
  .dlg.is-open .dlg-panel { transform: translate(-50%, -50%); opacity: 1; }
  .dlg-panel.is-pop { left: 50%; right: auto; width: min(440px, calc(100% - 48px)); transform: translate(-50%, -46%); }
  .dlg.is-open .dlg-panel.is-pop { transform: translate(-50%, -50%); }
  .dlg-panel.is-dream { width: min(720px, calc(100% - 48px)); height: min(860px, calc(100% - 48px)); }
}
/* wide: the controls and the list side by side, each with its own scroll */
@container app (min-width: 1000px) {
  .dlg-panel.is-dream.is-tune { width: min(1120px, calc(100% - 48px)); height: calc(100% - 48px); max-height: 900px; }
  .dlg-b.dr-tune { overflow: hidden; padding-bottom: 12px; }
  .dr-rest { display: inline; margin-left: 10px; }
  .dr-chips { flex-wrap: wrap; margin: 0; padding: 0; overflow: visible; }
  .is-tune .dlg-h p { display: block; }
  .dr-bar { position: static; margin: 0; padding: 0 0 8px; }
  .dr-tabs { display: none; }
  .dr-split { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(330px, 390px) minmax(0, 1fr); gap: 20px; }
  .dr-split[data-pane] .dr-panel, .dr-split[data-pane] .dr-results { display: block; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}
body { display: flex; flex-direction: column; }
.stage { flex: 1; min-height: 0; height: auto; }
.proto-bar { flex: none; margin: 0; padding: calc(3px + env(safe-area-inset-top, 0px)) 12px 3px; background: var(--ink); color: var(--surface); font-size: 11.5px; line-height: 16px; text-align: center; }

<p class="proto-bar">Prototyp: alle Inserate, Preise und Anbieter sind Beispieldaten.</p>
<div class="stage" id="stage">
<div class="view-toggle" id="viewToggle" role="group" aria-label="Vorschau">
  <button type="button" data-act="view" data-v="desktop" aria-pressed="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 5h17v11h-17zM9 20h6M12 16v4"/></svg>Desktop</button>
  <button type="button" data-act="view" data-v="mobile" aria-pressed="false"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.5 3h9a1.5 1.5 0 0 1 1.5 1.5v15a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 6 19.5v-15A1.5 1.5 0 0 1 7.5 3zM11 18h2"/></svg>Mobil</button>
</div>
<div class="app" id="app" data-sheet="peek">
  <div class="map" id="map" role="application" aria-label="Karte der Schweiz mit Inseraten. Ziehen zum Verschieben, Pinch oder Mausrad zum Zoomen.">
    <svg class="map-svg" id="mapSvg" aria-hidden="true"></svg>
    <div class="overlay" id="overlay"><div class="ov-layer" id="ovLayer"><div class="ov-sub" id="ovScale"></div><div class="ov-sub" id="ovPins"></div></div></div>
  </div>

  <div class="map-ctl-l"><div class="ctl-seg" id="pinMode" role="group" aria-label="Pins zeigen Preis oder Pendelzeit"></div></div>
  <div class="map-ctl" id="mapCtl">
    <button type="button" class="ctl ctl-solo ctl-draw" data-act="draw" id="drawBtn" aria-pressed="false" aria-label="Suchgebiet auf der Karte zeichnen" title="Gebiet zeichnen"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 16.5c-3.2-.7-5-3.2-4.3-6C5 7.4 9 5.4 13.6 6c4.4.6 7 3.4 6 6.2-.9 2.5-4.4 4.2-8.4 4.1M8.5 16.5c-1 .4-1.6 1.3-1.4 2.3.3 1.3 1.8 1.8 3 1.2M8.5 16.5l.3 3.5"/></svg></button>
    <div class="ctl-group">
      <button type="button" class="ctl" data-act="zoomIn" aria-label="Hineinzoomen"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 6v12M6 12h12"/></svg></button>
      <button type="button" class="ctl" data-act="zoomOut" aria-label="Herauszoomen"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 12h12"/></svg></button>
    </div>
    <button type="button" class="ctl ctl-solo" data-act="fit" aria-label="Alle Treffer zeigen"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/></svg></button>
  </div>

      <span class="vr" aria-hidden="true"></span>

    <button type="button" data-act="cancelPick">Abbrechen</button>
  </div>
  <div class="pick-banner draw-banner" id="drawBanner" hidden>

    <button type="button" data-act="drawView">Kartenausschnitt nehmen</button>
    <button type="button" data-act="cancelDraw">Abbrechen</button>
  </div>

  <section class="sheet" id="sheet" aria-label="Ergebnisse">
    <div class="sheet-grip" id="sheetGrip">
      <button type="button" class="sheet-title" data-act="toggleSheet" id="sheetToggle" aria-expanded="false">

        <span id="sheetSub" class="trunc"></span>
      </button>
      <div class="sheet-actions">

        <div class="sort-menu" id="sortMenu" role="group" aria-label="Sortieren" hidden></div>

    <div class="dlg-panel" id="dlgPanel" role="dialog" aria-modal="true" aria-labelledby="dlgTitle" tabindex="-1"></div>

</div>
</div>
